groups:
  - name: kafka-sdk-alerts
    rules:
      # Producer Alerts
      - alert: KafkaProducerHighLatency
        expr: histogram_quantile(0.99, rate(kafka_sdk_producer_send_latency_bucket[5m])) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka producer p99 latency is high"
          description: "Producer p99 latency is {{ $value }}ms, threshold is 1000ms"

      - alert: KafkaProducerHighErrorRate
        expr: rate(kafka_sdk_producer_errors_total[5m]) / rate(kafka_sdk_producer_messages_sent_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kafka producer error rate is above 5%"
          description: "Producer error rate is {{ $value | humanizePercentage }}"

      - alert: KafkaProducerCircuitBreakerOpen
        expr: kafka_sdk_circuit_breaker_state == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka producer circuit breaker is open"
          description: "Circuit breaker has been open for more than 1 minute"

      # Consumer Alerts
      - alert: KafkaConsumerHighLag
        expr: kafka_sdk_consumer_lag > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer lag for {{ $labels.topic }}-{{ $labels.partition }} is {{ $value }}"

      - alert: KafkaConsumerCriticalLag
        expr: kafka_sdk_consumer_lag > 100000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kafka consumer lag is critical"
          description: "Consumer lag for {{ $labels.topic }}-{{ $labels.partition }} is {{ $value }}"

      - alert: KafkaConsumerNotConsuming
        expr: rate(kafka_sdk_consumer_messages_consumed_total[5m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer is not consuming messages"
          description: "Consumer {{ $labels.group_id }} has not consumed any messages for 10 minutes"

      - alert: KafkaConsumerHighProcessingErrors
        expr: rate(kafka_sdk_consumer_processing_errors_total[5m]) / rate(kafka_sdk_consumer_messages_consumed_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer processing error rate is high"
          description: "Processing error rate is {{ $value | humanizePercentage }}"

      # DLQ Alerts
      - alert: KafkaDLQMessagesIncreasing
        expr: increase(kafka_sdk_dlq_messages_total[1h]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Dead letter queue is accumulating messages"
          description: "{{ $value }} messages added to DLQ in the last hour"

      # Backpressure Alerts
      - alert: KafkaBackpressureHighRejectionRate
        expr: rate(kafka_sdk_backpressure_rejected_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High backpressure rejection rate"
          description: "{{ $value }} requests/sec being rejected due to backpressure"

      - alert: KafkaBackpressureLowPermits
        expr: kafka_sdk_backpressure_permits_available / kafka_sdk_backpressure_permits_total < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backpressure permits running low"
          description: "Only {{ $value | humanizePercentage }} of permits available"

      # Health Alerts
      - alert: KafkaSDKUnhealthy
        expr: kafka_sdk_health_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka SDK health check failing"
          description: "SDK has been unhealthy for more than 1 minute"

      # Connection Alerts
      - alert: KafkaBrokerConnectionLost
        expr: kafka_sdk_broker_connections == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Lost connection to all Kafka brokers"
          description: "No active broker connections for more than 1 minute"
